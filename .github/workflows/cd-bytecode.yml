name: CD bytecode target

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/cd-bytecode.yml"
      - "docs/cd-bytecode-*.md"
      - "llvm/lib/Target/CD/**"
      - "llvm/test/CodeGen/CD/**"
      - "llvm/utils/cd_*"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cd-bytecode.yml"
      - "docs/cd-bytecode-*.md"
      - "llvm/lib/Target/CD/**"
      - "llvm/test/CodeGen/CD/**"
      - "llvm/utils/cd_*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  llvm-only:
    name: CD LLVM-only checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build

      - name: Build CD LLVM tools
        run: |
          cmake -S llvm -B build-cd -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=CD
          ninja -C build-cd llc FileCheck count

      - name: Run LLVM-only CD suite
        run: |
          env -u CD_COMPILER_ROOT build-cd/bin/llvm-lit -q llvm/test/CodeGen/CD
          PYTHONDONTWRITEBYTECODE=1 python3 llvm/utils/cd_bytecode_parity_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 llvm/utils/cd_module_link_test.py
          git diff --check

  vm-integration:
    name: CD Rust VM integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout CD VM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: junhui-he-cn/cd-compiler
          ref: 0295380ce3e29763949c09a815bda96cbed28ee2
          path: cd-compiler
          persist-credentials: false
          fetch-depth: 1

      - name: Install build tools and Rust
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build
          rustup toolchain install 1.94.1 --profile minimal --no-self-update
          rustup default 1.94.1
          rustc --version
          cargo --version

      - name: Build CD LLVM tools
        run: |
          cmake -S llvm -B build-cd -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DLLVM_EXPERIMENTAL_TARGETS_TO_BUILD=CD
          ninja -C build-cd llc FileCheck count

      - name: Run Rust VM, parity, and linked integration
        env:
          CD_COMPILER_ROOT: ${{ github.workspace }}/cd-compiler
        run: |
          cargo test --manifest-path "$CD_COMPILER_ROOT/vm-rs/Cargo.toml"
          cargo build --manifest-path "$CD_COMPILER_ROOT/vm-rs/Cargo.toml" --quiet
          PYTHONDONTWRITEBYTECODE=1 python3 llvm/utils/cd_bytecode_parity.py \
            --llc build-cd/bin/llc \
            --vm "$CD_COMPILER_ROOT/vm-rs/target/debug/compiler-design-vm" \
            --manifest llvm/test/CodeGen/CD/cdbc-machine-parity.list \
            --root .
          build-cd/bin/llvm-lit -sv llvm/test/CodeGen/CD/cdbc-vm-integration.py
          PYTHONDONTWRITEBYTECODE=1 python3 llvm/utils/cd_module_link_test.py
